name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: baal_agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pydantic-settings fastapi uvicorn openai httpx aiosqlite python-multipart Pillow pytest pytest-asyncio pytest-timeout
      - name: Test
        run: PYTHONPATH=$GITHUB_WORKSPACE pytest baal_agent/tests -q --timeout=60
